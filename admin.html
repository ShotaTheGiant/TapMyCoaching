<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin – Mykhailo Volkov Bookings</title>
<style>
:root{--bg:#f4f1ec;--surface:#fff;--text:#16130f;--muted:#6b645a;--line:#ddd6ca;--accent:#c8201a;--ok:#1d7a3a;--warn:#b7791f}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0f0e0c;--surface:#1a1816;--text:#f2ede4;--muted:#9a9285;--line:#2e2a25;--accent:#e0352d;--ok:#4cc277;--warn:#e0a84a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 "Helvetica Neue",Arial,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
h1,h2{font-family:Impact,"Arial Narrow Bold",sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.02em;margin:0}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px}
.btn{background:var(--accent);color:#fff;border:0;padding:10px 16px;border-radius:3px;font:inherit;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.sm{padding:6px 10px;font-size:13px}
input,select{padding:10px;border:2px solid var(--line);border-radius:3px;background:var(--surface);color:var(--text);font:inherit;width:100%}
input:focus,select:focus{outline:none;border-color:var(--accent)}
.hidden{display:none!important}
#login{min-height:100vh;display:grid;place-items:center;padding:16px}
.box{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--accent);padding:28px;width:100%;max-width:380px;display:grid;gap:12px}
.box label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.err{color:var(--accent);min-height:20px;font-size:14px}
.hint{color:var(--muted);font-size:12px}
header{background:#16130f;color:#f2ede4;padding:14px 0;border-bottom:4px solid var(--accent)}
header .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px}
header h1{font-size:22px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:18px 0}
.stat{background:var(--surface);border:1px solid var(--line);padding:12px}
.stat b{display:block;font:400 30px Impact,sans-serif}.stat span{color:var(--muted);font-size:13px}
.bar{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;margin-bottom:14px}
@media(max-width:600px){.bar{grid-template-columns:1fr}}
.row{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--warn);padding:12px 14px;margin-bottom:8px;display:grid;grid-template-columns:130px 1fr auto;gap:12px;align-items:center}
.row.confirmed{border-left-color:var(--ok)}.row.cancelled{border-left-color:var(--muted);opacity:.65}
@media(max-width:700px){.row{grid-template-columns:1fr}}
.when b{display:block;font:400 22px Impact,sans-serif}.when span{color:var(--muted);font-size:13px}
.who b{font-size:16px}.who div{color:var(--muted);font-size:14px}
.who a{color:var(--accent);font-weight:700;text-decoration:none}
.tag{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 6px;border:1px solid var(--line);margin-right:6px}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.empty{text-align:center;color:var(--muted);padding:40px 0}
</style>
</head>
<body>

<div id="login">
 <div class="box">
  <h2>Admin login</h2>
  <div><label for="em">Email</label><input id="em" type="email" autocomplete="username"></div>
  <div><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password"></div>
  <div class="err" id="lerr" role="alert"></div>
  <button class="btn" id="lbtn">Log in</button>
  <div class="hint">Sign in with the admin account created in Firebase Authentication.</div>
 </div>
</div>

<div id="app" class="hidden">
 <header><div class="wrap"><h1>Bookings · <span id="sn"></span> <small style="font:11px Arial;opacity:.6">v5</small></h1><div><button class="btn sm" id="out">Log out</button></div></div></header>
 <main class="wrap">
  <div class="stats" id="stats"></div>
  <div class="bar">
   <input id="q" placeholder="Search name, phone, Instagram…" aria-label="Search">
   <select id="f" aria-label="Filter"><option value="upcoming">Upcoming</option><option value="today">Today</option><option value="pending">Pending</option><option value="confirmed">Confirmed</option><option value="cancelled">Cancelled</option><option value="all">All</option></select>
   <select id="d" aria-label="Discipline"><option value="">All disciplines</option></select>
  </div>
  <div id="list"></div>
 </main>
</div>

<script type="module">
window.addEventListener("error",e=>{const l=document.getElementById("list");if(l)l.innerHTML='<div class="empty" style="color:var(--accent)">Script error: '+e.message+'</div>'});
window.addEventListener("unhandledrejection",e=>{const l=document.getElementById("list");if(l)l.innerHTML='<div class="empty" style="color:var(--accent)">Error: '+((e.reason&&(e.reason.code||e.reason.message))||e.reason)+'</div>'});
/* ============ DATA LAYER ============
   Everything the panel needs goes through DB. Today it uses localStorage
   (same key the booking page writes to). To use Firebase, replace the
   bodies below with the commented Firebase calls and keep the same shape. */
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,collection,getDoc,getDocs,onSnapshot,doc,updateDoc,deleteDoc,setDoc} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const slug=new URLSearchParams(location.search).get('c')||'';
const app=initializeApp({apiKey:"AIzaSyCtprYxyUHH3mh3rU2hXxdl4E5y-3sccLk",authDomain:"tapmymenu-c411b.firebaseapp.com",projectId:"tapmymenu-c411b",storageBucket:"tapmymenu-c411b.firebasestorage.app",messagingSenderId:"87565740314",appId:"1:87565740314:web:34a91e0b64af026e90a4a3"});
const auth=getAuth(app),fdb=getFirestore(app);
const DB={
 async login(e,p){try{await signInWithEmailAndPassword(auth,e,p)}catch(x){throw new Error('Wrong email or password.')}},
 async logout(){await signOut(auth)},
 async list(){const s=await getDocs(collection(fdb,'sites',slug,'bookings'));return s.docs.map(d=>({id:d.id,...d.data()}))},
 async update(id,patch){
  await updateDoc(doc(fdb,'sites',slug,'bookings',id),patch);
  const p=id.split('_'),r=doc(fdb,'sites',slug,'slots',id);
  if(patch.status==='cancelled')await deleteDoc(r);else await setDoc(r,{date:p[0],hour:Number(p[1])});
 },
 async remove(id){await deleteDoc(doc(fdb,'sites',slug,'bookings',id));await deleteDoc(doc(fdb,'sites',slug,'slots',id))}
};

const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmtH=h=>String(h).padStart(2,'0')+':00';
let all=[];

function show(){
 const on=!!auth.currentUser;
 $('login').classList.toggle('hidden',on);$('app').classList.toggle('hidden',!on);
 if(on)load();else if(unsub){unsub();unsub=null;all=[]}
}
let unsub=null;
function load(){
 if(unsub)return;
 unsub=onSnapshot(collection(fdb,'sites',slug,'bookings'),snap=>{
  all=snap.docs.map(d=>({id:d.id,...d.data()}));
  render();
 },e=>{
  unsub=null;render();
  const m=e.code==='permission-denied'
   ?'Permission denied. The Firestore rules are not published, or the admin email in the rules does not exactly match the email you logged in with ('+esc(auth.currentUser&&auth.currentUser.email)+').'
   :'Could not load bookings: '+esc(e.code||e.message);
  $('list').innerHTML='<div class="empty" style="color:var(--accent)">'+m+'</div>';
 });
}

function render(){
 const t=today(),q=$('q').value.trim().toLowerCase(),f=$('f').value,dc=$('d').value;
 const live=all.filter(b=>b.status!=='cancelled');
 $('stats').innerHTML=[
  ['Total',all.length],['Today',live.filter(b=>b.date===t).length],
  ['Upcoming',live.filter(b=>b.date>=t).length],['Pending',all.filter(b=>b.status==='pending').length]
 ].map(s=>'<div class="stat"><b>'+s[1]+'</b><span>'+s[0]+'</span></div>').join('');
 const rows=all.filter(b=>{
  if(f==='upcoming'&&!(b.date>=t&&b.status!=='cancelled'))return false;
  if(f==='today'&&b.date!==t)return false;
  if(['pending','confirmed','cancelled'].includes(f)&&b.status!==f)return false;
  if(dc&&b.disc!==dc)return false;
  if(q&&!((b.name||'')+(b.phone||'')+(b.insta||'')).toLowerCase().includes(q))return false;
  return true;
 }).sort((a,b)=>(a.date+String(a.hour).padStart(2,'0')).localeCompare(b.date+String(b.hour).padStart(2,'0')));
 if(!rows.length){$('list').innerHTML='<div class="empty">No bookings match.</div>';return}
 $('list').innerHTML=rows.map(b=>{
  const d=new Date(b.date+'T00:00');
  const ig=(b.insta||'').replace(/^@/,'').replace(/[^\w.]/g,'');
  return '<div class="row '+esc(b.status)+'"><div class="when"><b>'+fmtH(b.hour)+'</b><span>'+d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})+'</span></div>'
  +'<div class="who"><b>'+esc(b.name)+'</b> <span class="tag">'+esc(b.disc)+'</span><span class="tag">'+esc(b.status)+'</span>'
  +'<div><a href="tel:'+esc((b.phone||'').replace(/[^\d+]/g,''))+'">'+esc(b.phone)+'</a>'
  +(ig?' · <a href="https://instagram.com/'+ig+'" target="_blank" rel="noopener">@'+ig+'</a>':'')+'</div>'
  +(b.note?'<div>“'+esc(b.note)+'”</div>':'')+'</div>'
  +'<div class="acts">'
  +(b.status!=='confirmed'?'<button class="btn sm" data-a="confirmed" data-id="'+esc(b.id)+'">Confirm</button>':'')
  +(b.status!=='cancelled'?'<button class="btn ghost sm" data-a="cancelled" data-id="'+esc(b.id)+'">Cancel</button>':'')
  +'<button class="btn ghost sm" data-a="del" data-id="'+esc(b.id)+'">Delete</button></div></div>';
 }).join('');
}

$('list').onclick=async e=>{
 const b=e.target.closest('button');if(!b)return;
 const id=b.dataset.id,a=b.dataset.a;
 if(a==='del'){if(!confirm('Delete this booking permanently?'))return;await DB.remove(id)}
 else await DB.update(id,{status:a});
 load();
};
['q','f','d'].forEach(i=>$(i).oninput=render);
$('lbtn').onclick=async()=>{
 $('lerr').textContent='';
 try{await DB.login($('em').value.trim(),$('pw').value);$('pw').value='';show()}
 catch(e){$('lerr').textContent=e.message}
};
$('pw').onkeydown=e=>{if(e.key==='Enter')$('lbtn').click()};
$('out').onclick=async()=>{await DB.logout();show()};
if(!slug)document.body.innerHTML='<p style="padding:40px;font-family:Arial">Open this page with ?c=your-site-name</p>';
getDoc(doc(fdb,'sites',slug)).then(d=>{if(!d.exists())return;const S=d.data();$('sn').textContent=S.name;document.title='Admin – '+S.name;(S.disciplines||[]).forEach(x=>$('d').insertAdjacentHTML('beforeend','<option>'+esc(x.name)+'</option>'))}).catch(()=>{});
onAuthStateChanged(auth,show);
</script>
</body>
</html>
